name: Build and publish Moonpad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: moonpad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Update compiler and toolchain together
        if: github.event_name == 'workflow_dispatch'
        run: bash ./update.sh
      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh "$(cat .moon-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node moonpad/scripts/update-version.cjs
          pnpm install --lockfile-only
          cd moonpad
          npm publish --ignore-scripts --access public
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .moon-version moonpad/package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update published version [skip ci]"
            git push origin HEAD:main
          fi
